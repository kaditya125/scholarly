<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlowSq" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18181e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <filter id="limeGlowSq" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Square Background -->
  <rect width="512" height="512" fill="url(#bgGlowSq)"/>

  <!-- Centered Logo Group -->
  <g transform="translate(96, 96) scale(13.33)">
    <!-- Goal Dot (Vibrant Electric Lime) -->
    <circle cx="17.8" cy="5.4" r="2.5" fill="#c8e558" filter="url(#limeGlowSq)"/>

    <!-- Foreground Mountain Ridge -->
    <path
      d="M2.6 20.4l6.2-8.4 3.6 4.6"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Background Mountain Ridge (Depth Layer) -->
    <path
      d="M12.4 20.4l4.2-5.4 4.8 5.4"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.45"
    />
  </g>
</svg>
